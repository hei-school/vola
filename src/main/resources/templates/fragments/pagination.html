<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(applicationName, scope, startDate, endDate, currentPage, totalPages)">
  <div th:if="${totalPages > 1}" class="flex items-center justify-center gap-2 mt-6">
    <a th:if="${currentPage > 0}"
       th:href="@{/payments(applicationName=${applicationName}, scope=${scope}, startDate=${startDate}, endDate=${endDate}, page=${currentPage - 1})}"
       class="px-3 py-2 text-xs font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors">
      <span class="material-icons text-sm align-middle">chevron_left</span>
      Précédent
    </a>
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:if="${i == currentPage or (i >= currentPage - 2 and i <= currentPage + 2)}">
      <a th:if="${i != currentPage}"
         th:href="@{/payments(applicationName=${applicationName}, scope=${scope}, startDate=${startDate}, endDate=${endDate}, page=${i})}"
         class="px-3 py-2 text-xs font-medium rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors"
         th:text="${i + 1}">1</a>
      <span th:unless="${i != currentPage}"
            class="px-3 py-2 text-xs font-medium rounded-lg bg-[#800000] text-white"
            th:text="${i + 1}">1</span>
    </span>
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/payments(applicationName=${applicationName}, scope=${scope}, startDate=${startDate}, endDate=${endDate}, page=${currentPage + 1})}"
       class="px-3 py-2 text-xs font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-colors">
      Suivant
      <span class="material-icons text-sm align-middle">chevron_right</span>
    </a>
  </div>
</div>
</body>
</html>
